[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentlinker-s126-replication"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0.0",
    "diskcache>=5.6.1",
    "nltk>=3.9",
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
