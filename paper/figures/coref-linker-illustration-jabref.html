<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure — four reference forms in a shared JabRef-inspired example</title>
<style>
  /* Laid out at the paper's measure: acmsmall \textwidth = 395.82pt = 5.477in.
     Print at 100% and crop #plate; it drops into \includegraphics[width=\linewidth]. */
  :root{ --ink:#000; --mut:#5b5b5b; --rule:#9a9a9a; --hair:#c9c9c9;
         --ok:#14634a; --no:#98191c; --code:#2a4a7f; --wash:#f7f7f7; }
  *{box-sizing:border-box}
  html{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{margin:0; padding:14px; background:#fff; color:var(--ink);
       font-family:"Linux Libertine O",Libertine,"Times New Roman",Times,serif}
  .fig{width:5.477in; margin:0 auto}
  .mono,code,pre{font-family:"IBM Plex Mono","Latin Modern Mono",Menlo,Consolas,monospace}

  .panel{border:0.5px solid var(--rule); margin-bottom:4px}
  .panel > h3{margin:0; padding:2px 5px; font-size:7.2pt; font-weight:700; line-height:1.3;
    border-bottom:0.5px solid var(--rule); background:#efefef;
    display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .panel > h3 .cnt{font-weight:400; font-size:6.6pt; color:var(--mut); white-space:nowrap}
  .pbody{padding:4px 5px}
  .split{display:grid; gap:0}
  .split > *{padding:4px 5px}
  .split > * + *{border-left:0.5px solid var(--hair)}
  .s73{grid-template-columns:2.15fr 1fr}

  p{margin:0; font-size:6.9pt; line-height:1.36}
  .qt{font-style:italic; color:var(--mut)}
  .lbl{display:block; font-size:6.1pt; letter-spacing:.05em; text-transform:uppercase;
       font-weight:700; color:var(--mut); margin:4px 0 1.5px}
  .lbl:first-child{margin-top:0}

  .doc{font-size:7pt; line-height:1.35}
  .doc div{display:flex; gap:4px; padding:1px 0}
  .doc .n{font-family:"IBM Plex Mono",monospace; font-size:6.2pt; color:var(--mut);
          min-width:14px; text-align:right; flex:none; padding-top:.5px}
  .nm{border-bottom:1.2px solid #8ba8d0; font-weight:600}
  .rf{background:#f0e2c4; padding:0 1px}

  pre{margin:0; font-size:6.4pt; line-height:1.42; white-space:pre; overflow:visible;
      background:var(--wash); border:0.5px solid var(--hair); padding:3px 4px}
  .slot{color:var(--code); font-weight:700}
  .yes{color:var(--ok); font-weight:700}
  .nay{color:var(--no); font-weight:700}

  table{border-collapse:collapse; width:100%; font-size:6.6pt}
  th,td{text-align:left; padding:1.5px 3px; border-bottom:0.5px solid var(--hair); line-height:1.25}
  thead th{font-size:6pt; text-transform:uppercase; letter-spacing:.03em; color:var(--mut);
           border-bottom:0.75px solid var(--ink); font-weight:700}
  tbody tr:last-child td{border-bottom:0.75px solid var(--ink)}
  td.m{font-family:"IBM Plex Mono",monospace; font-size:6.2pt; white-space:nowrap}
  td.c,th.c{text-align:center}
  .ok{color:var(--ok); font-weight:700}
  .no{color:var(--no); font-weight:700}

  figcaption{margin-top:6px; font-size:7.4pt; line-height:1.42; text-align:justify; hyphens:auto}
  figcaption .fnum,figcaption .sub{font-weight:700}
  .exportnote{margin-top:5px; font-size:5.8pt; color:var(--mut); font-style:italic;
              border-top:0.5px solid var(--hair); padding-top:3px}
  @media print{ body{padding:0} .panel{break-inside:avoid} }
</style>
</head>
<body>
<figure class="fig">
<div id="plate">

<!-- Shared illustrative example used by the motivation and approach discussions:
     S6 reaches gui by alias, S7 reaches gui by coreference, S8 reaches the
     multi-word Data Model by a partial name, and S11 reaches preferences exactly. -->

<!-- (a) the sentences, and what comes out -->
<div class="panel">
  <h3><span>(a)&nbsp; One shared illustrative excerpt, and the links recovered from it</span>
      <span class="cnt">3 components</span></h3>
  <div class="split s73">
    <div class="doc">
      <div><span class="n">S6</span><span>The <span class="rf">UI</span> renders the main application window.</span></div>
      <div><span class="n">S7</span><span><span class="rf">It</span> knows the user and their <span class="nm">preferences</span>.</span></div>
      <div><span class="n">S8</span><span>The <span class="nm">model</span> stores entries and metadata.</span></div>
      <div><span class="n">S11</span><span>The <span class="nm">preferences</span> component stores user settings.</span></div>
      <p class="qt" style="margin-top:4px">Underlined&thinsp;= a written span. Shaded&thinsp;= a referring expression. The alias table contains <span class="mono">UI&rarr;gui</span>; <span class="mono">model</span> is the partial form of <span class="mono">Data Model</span>. In S7, <span class="mono">preferences</span> is ordinary vocabulary, not the component.</p>
    </div>
    <div style="padding:0">
      <table>
        <thead><tr><th>Candidate</th><th>form</th><th class="c">name<br>judge</th><th class="c">coref<br>judge</th><th class="c">gold</th></tr></thead>
        <tbody>
          <tr><td class="m">S6&rarr;gui</td><td>alias</td><td class="c ok">keep</td><td class="c">&mdash;</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S7&rarr;gui</td><td>coref</td><td class="c">&mdash;</td><td class="c ok">keep</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S7&rarr;prefs</td><td>ordinary</td><td class="c no">rej</td><td class="c no">rej</td><td class="c no">&times;</td></tr>
          <tr><td class="m">S8&rarr;data model</td><td>partial</td><td class="c ok">keep</td><td class="c">&mdash;</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S11&rarr;prefs</td><td>exact</td><td class="c ok">keep</td><td class="c">&mdash;</td><td class="c ok">&check;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- (b) name route -->
<div class="panel">
  <h3><span>(b)&nbsp; Name route: the same judge sees exact, partial, and alias evidence</span>
      <span class="cnt">3 forms &rarr; 3 candidates</span></h3>
  <div class="pbody">
    <p class="qt">&ldquo;Approve when the sentence uses that word as the name of the component; if it is used in its ordinary sense, reject. Reject only on a positive ground. The evidence bundle supplies facts, not the verdict.&rdquo;</p>
<pre style="margin-top:3px">Case 1: "preferences" -&gt; preferences   [exact]
  "The preferences component stores user settings."
  Evidence: <span class="slot">{source=full_name, span="preferences",
    naming=whole_name, mention="preferences",
    alternatives=[], last_named=none}</span>
-&gt; {"claim":"stores user settings", "approve":<span class="yes">true</span>}

Case 2: "model" -&gt; Data Model             [partial]
  "The model stores entries and metadata."
  Evidence: <span class="slot">{source=partial_name, span="model",
    naming=partial_name, mention="model",
    alternatives=[], last_named=none}</span>
-&gt; {"claim":"stores entries and metadata", "approve":<span class="yes">true</span>}

Case 3: "UI" -&gt; gui                       [alias]
  "The UI renders the main application window."
  Evidence: <span class="slot">{source=alias, span="UI", naming=alias,
    mention="UI", alternatives=[], last_named=none}</span>
-&gt; {"claim":"renders the main application window", "approve":<span class="yes">true</span>}</pre>
    <p class="qt" style="margin-top:3px">The match computes <span class="mono" style="font-style:normal">{source, span, naming, mention, alternatives, last_named}</span>; every name case carries the full bundle. The source distinguishes the exact name, a partial name, and a known alias; the judge then checks the sentence&rsquo;s architectural claim.</p>
  </div>
</div>

<!-- (c) reference route -->
<div class="panel">
  <h3><span>(c)&nbsp; Reference route: one case &mdash; what the resolver commits to is the bundle the judge rules on</span>
      <span class="cnt">S7 &rarr; gui &middot; approved</span></h3>
  <div class="split s55">
    <div>
      <span class="lbl">the judge&rsquo;s case, verbatim</span>
<pre>Case 1: pronoun/role-ref -&gt; gui
  Claimed reference: <span class="slot">"It"</span>
  Claimed antecedent (S6): <span class="slot">"The UI"</span>
  [prev: The UI renders the main application window.]
    "It knows the user and their preferences."
-&gt; {"claim":"It knows the user and their preferences.",
    "objection":<span class="yes">"none"</span>, "approve":<span class="yes">true</span>}</pre>
      <p class="qt" style="margin-top:3px">&ldquo;Approve only when the sentence contains a genuine referring expression that unambiguously points to THIS component and makes an architectural claim about it; when uncertain, reject.&rdquo;</p>
    </div>
    <div>
      <span class="lbl">the input: target, and the antecedent</span>
      <div class="doc">
        <div><span class="n">S6</span><span>The <span class="nm">UI</span> renders the main application window. <span class="qt">&larr; antecedent</span></span></div>
        <div><span class="n">S7</span><span><span class="rf">It</span> knows the user and their <span class="nm">preferences</span>.</span></div>
      </div>
      <p class="qt" style="margin-top:2px">The pronoun names no component; the resolver follows the alias-bearing antecedent in S6 and commits to <span class="mono">gui</span>.</p>
      <span class="lbl">computed prior</span>
<pre>NAMED BEFORE THIS CASE: <span class="slot">gui (S6)</span></pre>
      <span class="lbl">the resolver&rsquo;s commitment</span>
<pre>-&gt; {"case":1, "sentence":7,
    "reference":<span class="b">"It"</span>, "candidates":["gui"],
    "component":<span class="b">"gui"</span>,
    "antecedent_sentence":<span class="b">6</span>,
    "antecedent_text":<span class="b">"The UI"</span>}</pre>
    </div>
  </div>
</div>

</div><!-- /plate -->

<figcaption>
  <span class="fnum">Figure&nbsp;3:</span> Four ways an illustrative documentation excerpt reaches architecture components.
  <span class="sub">(a)</span> The shared excerpt contains an alias mention in S6, a pronoun in S7 whose antecedent is shown
  immediately above it, a partial name in S8, and an exact name in S11. The ordinary use of &ldquo;preferences&rdquo; in S7
  creates the false candidate that the name judge rejects.
  <span class="sub">(b)</span> The name route records the full computed bundle for each written form:
  <span class="mono">{source, span, naming, mention, alternatives, last_named}</span>. The source field distinguishes
  exact, partial, and alias matches; the judge then checks the sentence&rsquo;s architectural claim.
  <span class="sub">(c)</span> The coreference route has no name-match bundle. It carries the target&rsquo;s exact referring expression
  and the exact antecedent sentence used to resolve it; here &ldquo;It&rdquo; in S7 follows &ldquo;The UI&rdquo; in S6 and resolves to
  <span class="mono">gui</span>.
</figcaption>

<p class="exportnote">Export note: the graphic is <span class="mono">#plate</span> only &mdash; print at 100&thinsp;% and crop, or screenshot the node. It is already at the paper&rsquo;s measure (395.82&thinsp;pt = 5.477&thinsp;in). The caption is draft <span class="mono">\caption{}</span> text; the figure number is a placeholder.</p>

</figure>
