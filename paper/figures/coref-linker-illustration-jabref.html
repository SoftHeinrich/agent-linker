<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figure — a MediaStore ground-truth example</title>
<style>
  /* Laid out at the paper's measure: acmsmall \textwidth = 395.82pt = 5.477in.
     Print at 100% and crop #plate; it drops into \includegraphics[width=\linewidth]. */
  :root{ --ink:#000; --mut:#5b5b5b; --rule:#9a9a9a; --hair:#c9c9c9;
         --ok:#14634a; --no:#98191c; --code:#2a4a7f; --wash:#f7f7f7; }
  *{box-sizing:border-box}
  html{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{margin:0; padding:14px; background:#fff; color:var(--ink);
       font-family:"Linux Libertine O",Libertine,"Times New Roman",Times,serif}
  .fig{width:5.477in; margin:0 auto}
  .mono,code,pre{font-family:"IBM Plex Mono","Latin Modern Mono",Menlo,Consolas,monospace}

  .panel{border:0.5px solid var(--rule); margin-bottom:4px}
  .panel > h3{margin:0; padding:2px 5px; font-size:7.2pt; font-weight:700; line-height:1.3;
    border-bottom:0.5px solid var(--rule); background:#efefef;
    display:flex; justify-content:space-between; gap:8px; align-items:baseline}
  .panel > h3 .cnt{font-weight:400; font-size:6.6pt; color:var(--mut); white-space:nowrap}
  .pbody{padding:4px 5px}
  .split{display:grid; gap:0}
  .split > *{padding:4px 5px}
  .split > * + *{border-left:0.5px solid var(--hair)}
  .s73{grid-template-columns:2.15fr 1fr}
  .s55{grid-template-columns:1fr 1fr}

  p{margin:0; font-size:6.9pt; line-height:1.36}
  .qt{font-style:italic; color:var(--mut)}
  .lbl{display:block; font-size:6.1pt; letter-spacing:.05em; text-transform:uppercase;
       font-weight:700; color:var(--mut); margin:4px 0 1.5px}
  .lbl:first-child{margin-top:0}

  .doc{font-size:7pt; line-height:1.35}
  .doc div{display:flex; gap:4px; padding:1px 0}
  .doc .n{font-family:"IBM Plex Mono",monospace; font-size:6.2pt; color:var(--mut);
          min-width:14px; text-align:right; flex:none; padding-top:.5px}
  .nm{border-bottom:1.2px solid #8ba8d0; font-weight:600}
  .rf{background:#f0e2c4; padding:0 1px}

  pre{margin:0; font-size:6.4pt; line-height:1.42; white-space:pre; overflow:visible;
      background:var(--wash); border:0.5px solid var(--hair); padding:3px 4px}
  pre.compact{font-size:5.75pt; white-space:pre-wrap; overflow-wrap:anywhere}
  .slot{color:var(--code); font-weight:700}
  .yes{color:var(--ok); font-weight:700}
  .nay{color:var(--no); font-weight:700}

  table{border-collapse:collapse; width:100%; font-size:6.6pt}
  th,td{text-align:left; padding:1.5px 3px; border-bottom:0.5px solid var(--hair); line-height:1.25}
  thead th{font-size:6pt; text-transform:uppercase; letter-spacing:.03em; color:var(--mut);
           border-bottom:0.75px solid var(--ink); font-weight:700}
  tbody tr:last-child td{border-bottom:0.75px solid var(--ink)}
  td.m{font-family:"IBM Plex Mono",monospace; font-size:6.2pt; white-space:nowrap}
  td.c,th.c{text-align:center}
  .ok{color:var(--ok); font-weight:700}
  .no{color:var(--no); font-weight:700}

  figcaption{margin-top:6px; font-size:7.4pt; line-height:1.42; text-align:justify; hyphens:auto}
  figcaption .fnum,figcaption .sub{font-weight:700}
  .exportnote{margin-top:5px; font-size:5.8pt; color:var(--mut); font-style:italic;
              border-top:0.5px solid var(--hair); padding-top:3px}
  @media print{ body{padding:0} .panel{break-inside:avoid} }
</style>
</head>
<body>
<figure class="fig">
<div id="plate">

<!-- Verbatim MediaStore sentences and hand-labeled links used by the motivation
     and approach discussions. The S24--S27 gap is explicit. -->

<!-- (a) the sentences, and what comes out -->
<div class="panel">
  <h3><span>(a)&nbsp; MediaStore benchmark excerpt and its ground-truth links</span>
      <span class="cnt">2 components</span></h3>
  <div class="split s73">
    <div class="doc">
      <div><span class="n">S23</span><span>The <span class="nm">Database</span> component represents an actual database (e.g., MySQL).</span></div>
      <div><span class="n">S24</span><span><span class="rf">It</span> stores user information and meta-data of audio files such as the name and the genre.</span></div>
      <div><span class="n">&vellip;</span><span></span></div>
      <div><span class="n">S27</span><span>The <span class="nm">MediaAccess</span> component encapsulates <span class="rf">database access</span> for meta-data of audio files.</span></div>
      <div><span class="n">S28</span><span>Furthermore, <span class="rf">it</span> fetches a list of all available audio files.</span></div>
      <p class="qt" style="margin-top:4px">Text is verbatim from the benchmark. Underlined&thinsp;= a written name. Shaded&thinsp;= a referring or ambiguous expression. In S27, <span class="mono">database access</span> describes <span class="mono">MediaAccess</span>, not <span class="mono">DB</span>.</p>
    </div>
    <div style="padding:0">
      <table>
        <thead><tr><th>Candidate</th><th>proposer</th><th class="c">judge</th><th class="c">gold</th></tr></thead>
        <tbody>
          <tr><td class="m">S23&rarr;DB</td><td class="m">name</td><td class="c ok">keep</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S24&rarr;DB</td><td class="m">coreference</td><td class="c ok">keep</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S27&rarr;MediaAccess</td><td class="m">name</td><td class="c ok">keep</td><td class="c ok">&check;</td></tr>
          <tr><td class="m">S27&rarr;DB</td><td class="m">name</td><td class="c no">reject</td><td class="c no">&times;</td></tr>
          <tr><td class="m">S28&rarr;MediaAccess</td><td class="m">coreference</td><td class="c ok">keep</td><td class="c ok">&check;</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- (b) knowledge and name route -->
<div class="panel">
  <h3><span>(b)&nbsp; Knowledge and name route: the same form requires two verdicts</span>
      <span class="cnt">recorded s124 run</span></h3>
  <div class="pbody">
    <p class="qt">The discovery judge approves the document-wide mapping, but the link judge still checks what the same word means in each sentence.</p>
<pre style="margin-top:3px">discovered: "Database" -&gt; DB   -&gt; <span class="yes">approved</span>

Case 15: "Database" -&gt; DB
  "The Database component represents an actual database (e.g., MySQL)."
  Evidence: <span class="slot">written=short form</span>
-&gt; {"claim":"The Database component represents an actual database",
    "approve":<span class="yes">true</span>}

Case 19: "database" -&gt; DB
  "The MediaAccess component encapsulates database access for meta-data of audio files."
  Evidence: <span class="slot">written=short form</span>
-&gt; {"claim":"none", "approve":<span class="nay">false</span>}</pre>
    <p class="qt" style="margin-top:3px">The mapping supplies candidates, not verdicts: S23 discusses <span class="mono">DB</span>; S27 uses the same word to name a responsibility of <span class="mono">MediaAccess</span>.</p>
  </div>
</div>

<!-- (c) reference route -->
<div class="panel">
  <h3><span>(c)&nbsp; Reference route: two recorded LLM prompts for one S24 case</span>
      <span class="cnt">S24 &rarr; DB</span></h3>
  <div class="split s55">
    <div>
      <span class="lbl">LLM 1 &mdash; resolver prompt (case excerpt)</span>
<pre class="compact">--- Case 4 ---
TARGET S24: It stores user information and meta-data of audio files such as the name and the genre.
NAMED BEFORE THIS CASE: DB (S23, linked), Reencoding (S20, linked), Packaging (S19, linked), TagWatermarking (S17, linked), MediaManagement (S17, linked)</pre>
      <span class="lbl">resolver response: the coreference bundle</span>
<pre class="compact">{"case":4, "sentence":24,
 "reference":<span class="slot">"It"</span>, "candidates":["DB"],
 "component":<span class="slot">"DB"</span>,
 "antecedent_sentence":<span class="slot">23</span>,
 "antecedent_text":<span class="slot">"The Database component represents an actual database (e.g., MySQL)."</span>}</pre>
      <p class="qt" style="margin-top:3px">These are the resolver&rsquo;s real response fields; the highlighted commitment is carried into the second prompt.</p>
    </div>
    <div>
      <span class="lbl">LLM 2 &mdash; judge prompt (case excerpt)</span>
<pre class="compact">Case 5: pronoun/role-ref -&gt; DB
  Claimed reference: "It"
  Claimed antecedent (S23): "The Database component represents an actual database (e.g., MySQL)."
  [prev: The Database component represents an actual database (e.g., MySQL).] "It stores user information and meta-data of audio files such as the name and the genre."</pre>
      <span class="lbl">judge response</span>
<pre class="compact">{"case":5,
 "claim":"It stores user information and meta-data of audio files such as the name and the genre.",
 "objection":<span class="yes">"none"</span>,
 "approve":<span class="yes">true</span>}</pre>
      <p class="qt" style="margin-top:3px">The judge sees the resolver&rsquo;s exact reference and antecedent, rather than reconstructing them from the sentence.</p>
    </div>
  </div>
</div>

</div><!-- /plate -->

<figcaption>
  <span class="fnum">Figure&nbsp;3:</span> One real MediaStore excerpt through the workflow.
  <span class="sub">(a)</span> Verbatim benchmark Sentences 23, 24, 27, and 28 and their hand-labeled links; the vertical ellipsis marks the omitted sentences.
  <span class="sub">(b)</span> The recorded s124 run uses <span class="mono">Database&rarr;DB</span> to keep S23 but rejects S27&rsquo;s <span class="mono">DB</span> candidate because &ldquo;database access&rdquo; describes <span class="mono">MediaAccess</span>.
  <span class="sub">(c)</span> For S24, the first recorded prompt resolves <span class="mono">It</span> through S23 to <span class="mono">DB</span>; the second judges that exact commitment and approves it. The table also reports the corresponding S28 result.
</figcaption>

<p class="exportnote">Export note: the graphic is <span class="mono">#plate</span> only &mdash; print at 100&thinsp;% and crop, or screenshot the node. It is already at the paper&rsquo;s measure (395.82&thinsp;pt = 5.477&thinsp;in). The caption is draft <span class="mono">\caption{}</span> text; the figure number is a placeholder.</p>

</figure>
</body>
</html>
