[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sad-sam-agent"
version = "0.1.0"
description = "LLM-based SAD-SAM trace link recovery agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.0",
    "lxml>=5.0.0",
    "rapidfuzz>=3.0.0",
    "diskcache>=5.6.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
